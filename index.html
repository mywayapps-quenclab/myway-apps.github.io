<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join a GatherNext Calendar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
        sans-serif;
      background: #f0f7ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #208AEF;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 14px;
      color: #888;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 12px;
    }

    .invite-code {
      font-size: 13px;
      color: #666;
      margin-bottom: 32px;
      background: #f5f5f5;
      padding: 8px 16px;
      border-radius: 8px;
      display: inline-block;
      font-family: monospace;
      letter-spacing: 1px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 12px;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: #208AEF;
      color: white;
    }

    .btn-secondary {
      background: white;
      color: #208AEF;
      border: 2px solid #208AEF;
    }

    .hint {
      font-size: 13px;
      color: #aaa;
      margin-top: 24px;
      line-height: 1.5;
    }

    .stores {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .stores a {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      background: #f5f5f5;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      text-decoration: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">GatherNext</div>
    <div class="tagline">Shared calendars made simple.</div>

    <h1>You've been invited to join a calendar</h1>

    <div class="invite-code" id="code-display"></div>

    <a class="btn btn-primary" id="open-btn" href="#">
      Open in GatherNext
    </a>

    <div class="hint">Already have GatherNext? Tap above to join instantly.</div>

    <div class="hint" style="margin-top: 20px;">
      Don't have the app yet? Download it first:
    </div>

    <div class="stores">
      <a href="https://play.google.com/store" id="android-link">
        Google Play
      </a>
      <a href="https://apps.apple.com" id="ios-link">
        App Store
      </a>
    </div>
  </div>

  <script>
    // Read the invite code from the URL path
    // URL format: myway-apps.com/join/INVITECODE
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const inviteCode = pathParts[pathParts.length - 1] ?? '';

    if (inviteCode && inviteCode !== 'join') {
      document.getElementById('code-display').textContent =
        'Invite code: ' + inviteCode.toUpperCase();
      document.getElementById('open-btn').href =
        'gathernext://join/' + inviteCode.toUpperCase();
    } else {
      document.getElementById('code-display').textContent =
        'No invite code found in this link.';
      document.getElementById('open-btn').style.display = 'none';
    }

    // Update these links once your app is live in the stores
    // document.getElementById('android-link').href = 'your play store url';
    // document.getElementById('ios-link').href = 'your app store url';
  </script>
</body>
</html>
