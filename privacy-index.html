<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policies</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
        sans-serif;
      background: #f0f7ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #208AEF;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 28px;
    }

    .app-link {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 12px;
      background: white;
      color: #208AEF;
      border: 2px solid #208AEF;
    }

    .hint {
      font-size: 13px;
      color: #aaa;
      margin-top: 24px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">MyWay Apps</div>
    <h1>Privacy Policies</h1>

    <a class="app-link" href="/privacy/ultimate-sticky-note.html">Ultimate Sticky Note</a>

    <div class="hint">More apps will be listed here as they're published.</div>
  </div>
</body>
</html>
